name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Backend (Node.js / Express) ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: "ci-test-secret-that-is-long-enough"
          # DB_LOCATION is not needed — mongodb-memory-server is used
          CLOUDINARY_CLOUD_NAME: "ci-test"
          CLOUDINARY_API_KEY: "ci-test-key"
          CLOUDINARY_API_SECRET: "ci-test-secret"
          ML_SERVICE_URL: "http://localhost:18000"

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/

  # ── Frontend (React / Vite) ───────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "blogging website - frontend"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "blogging website - frontend/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: "blogging website - frontend/coverage/"

  # ── ML Service (Python / FastAPI) ────────────────────────────────────────────
  ml-tests:
    name: ML Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-test.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest --tb=short -v
        env:
          DB_LOCATION: "mongodb://localhost:27017/test_bigblog"
